# Workflow 模板：iOS（xcodebuild）
# =============================================================================
# 适用项目：使用 Xcode 工程（.xcodeproj / .xcworkspace）的 iOS 应用。
#
# 一键复制方法：
#   1. 将本文件复制到你的仓库 .github/workflows/ios-xcodebuild.yml
#   2. 按需修改 scheme、project/workspace 路径
#   3. push 到 main 分支（或发起 PR）即可触发
#
# 环境说明：
# - Macrunara 节点为标准 Apple Silicon M4 macOS 环境，预装 Xcode 26.x + CLT，
#   无需在 job 内安装任何环境；
# - 构建使用 macrunara/build-actions/ios：xcodebuild 构建 + 检测到 .xcarchive
#   自动导出 IPA（development 方式，导出失败仅告警）+ 产物上传。
# =============================================================================

name: iOS CI (xcodebuild)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-ios:
    # 标准标签写法：[macos, arm64, macrunara]
    # 禁止写 self-hosted / macos-latest 等节点未上报的标签，否则任务永远排队
    runs-on: [macos, arm64, macrunara]

    steps:
      # Step 1: 检出代码
      - uses: actions/checkout@v4

      # Step 2（可选）: Macrunara Setup Action
      # --------------------------------------
      # 作用：打印品牌横幅（日志可见"本 job 由 Macrunara 执行"）、校验参数、
      # 导出环境信息（MACRUNARA_REGION 等）。本步骤不是必需的，删除后不影响构建。
      - uses: macrunara/setup-action@v1
        with:
          # Installation ID 从仓库 Secrets 读取（Settings → Secrets and variables → Actions）
          installation-id: ${{ secrets.MACRUNARA_INSTALLATION_ID }}
          region: auto

      # Step 3: 打印环境信息（便于排障）
      - name: Show Environment
        run: |
          echo "OS:   $(uname -s) $(uname -m)"
          echo "Runner: $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)"
          xcodebuild -version

      # Step 4: 构建 + 归档导出 + 上传
      # ------------------------------
      # configuration/sdk 按项目调整；使用 .xcworkspace 时把路径传给 project 即可。
      # CI 不做代码签名；如需 TestFlight/蒲公英分发请自行扩展签名步骤。
      - name: Build & Upload
        uses: macrunara/build-actions/ios@v1
        with:
          scheme: MyApp
          project: MyApp.xcodeproj
          configuration: Release
          sdk: iphoneos
          upload_artifact: true
          artifact_name: ios-build-products
          artifact_path: build/Release-iphoneos

