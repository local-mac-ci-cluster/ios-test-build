# Workflow: iOS demo — 验证 quickstart/templates/ios-xcodebuild.yml 新版（纯 run: 形态）
# 变更：移除原注释块中 local-mac-runner-action 引用（已弃置、仓库已私有），
# 启用纯 xcodebuild 构建（Kingfisher 项目，scheme: Kingfisher）。
name: iOS CI (xcodebuild)

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: [macos, arm64, macrunara]
    timeout-minutes: 30

    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - uses: actions/checkout@v5

      - name: Show Environment
        run: |
          echo "OS:   $(uname -s) $(uname -m)"
          echo "Runner: $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)"
          xcodebuild -version

      - name: Build & Archive
        run: |
          set -o pipefail
          xcodebuild -scheme Kingfisher -project Kingfisher.xcodeproj \
            -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            -archivePath build/Kingfisher.xcarchive archive

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-products
          path: build/
