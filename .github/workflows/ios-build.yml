name: iOS 编译测试

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, macos-latest]
    steps:
      - name: 接入本地 Mac CI 集群
        uses: local-mac-ci-cluster/local-mac-runner-action@main

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 编译 Kingfisher
        run: |
          xcodebuild -project Kingfisher.xcodeproj \
            -scheme Kingfisher \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO
